site_name: Sizeamatic Pro
site_description: Stereo video measurement tool developer docs
repo_url: https://github.com/MarineAppliedResearch/Sizeamatic-Pro

# mkdocstrings pulls docs live from these source files, but mkdocs's dev
# server only auto-watches docs_dir + this config file by default. Without
# this, `mkdocs serve` silently keeps showing a stale build after any .py
# edit — list every first-party module here so hot-reload actually works.
watch:
  - main.py
  - stereo_matching.py
  - measurement_window.py
  - calibration_summary.py
  - anaglyph_preview.py
  - video_overlay.py
  - generate_calibration_report.py
  - create_charuco_calibration_target.py

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Reference:
      - main.py: reference/main.md
      - stereo_matching.py: reference/stereo_matching.md
      - measurement_window.py: reference/measurement_window.md
      - calibration_summary.py: reference/calibration_summary.md
      - anaglyph_preview.py: reference/anaglyph_preview.md
      - video_overlay.py: reference/video_overlay.md
      - generate_calibration_report.py: reference/generate_calibration_report.md
      - create_charuco_calibration_target.py: reference/create_charuco_calibration_target.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_if_no_docstring: true
            filters: []
